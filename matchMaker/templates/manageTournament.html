{% extends 'pageSkeleton.html' %}

{% block content %}

  <h1>Tournament Management</h1>
  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}
  <form method="post">
  
      {% csrf_token %}
      {{ form }}
      <input type="submit" value="Submit">

      <div>
        <button type="submit" name="action" value="delete_tournament">Delete Tournament</button>
        <button type="submit" name="action" value="start_tournament">Start Tournament</button>
      </div>
      
      

  </form>

{% endblock %}
