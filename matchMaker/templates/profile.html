<!DOCTYPE html>
<html>
<body>

{% load static %}

<link rel="stylesheet" href="{% static 'style.css' %}">

<h1>User Profile</h1>

{% if messages %}
  {% for message in messages %}
    <p>{{ message }}</p>
  {% endfor %}
{% endif %}

<p>Username: {{ user.username }}</p>
<p>Full Name: {{ user.firstname }} + {{ user.lastname }}</p>
<p>Gender: {{ user.gender }}</p>
<p>Date of Birth: {{ user.DOB }}</p>

</body>
</html>
