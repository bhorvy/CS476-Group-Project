{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Match Maker{% endblock %}</title>
</head>

<body>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    {% include 'modules/navbar.html' %}
    <main>
        {% block content %}

        {% endblock %}
    </main>
</body>

</html>

{% if user.is_authenticated %}
<script> 
async function checkTournamentNotifications() {
    const response = await fetch("{% url 'tournamentNotifications' %}");
    const data = await response.json();
    
    for (const notification of data.notifications) {
        // can change it to not be an alert, easy implementation for now
            alert(notification.message);
        }
    }

checkTournamentNotifications();
//check every 5 seconds for notifications
setInterval(checkTournamentNotifications, 5000);

</script>
{% endif %}
