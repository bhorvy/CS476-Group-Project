{% extends 'pageSkeleton.html' %}

{% block content %}

  <h1>Register a New User</h1>
  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}
  <form method="post">
  
      {% csrf_token %}
      {{ form }}
      <input type="submit" value="Submit">

  </form>

{% endblock %}
